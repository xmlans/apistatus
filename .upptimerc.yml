owner: xmlans
repo: apistatus

secrets:
  - AI_API_KEY

sites:
  - name: Official MiniMax API
    slug: Minimax
    url: https://api.xmyun.org/v1/chat/completions
    method: POST
    headers:
      - "Authorization: Bearer $AI_API_KEY"
      - "Content-Type: application/json"
    body: >
      {
        "model": "MiniMax-M3",
        "messages": [
          {
            "role": "user",
            "content": "Reply only OK"
          }
        ],
        "max_tokens": 5,
        "stream": false
      }
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"choices"'
    maxResponseTime: 20000

  - name: Official DeepSeek API
    slug: DeepSeek
    url: https://api.xmyun.org/v1/chat/completions
    method: POST
    headers:
      - "Authorization: Bearer $AI_API_KEY"
      - "Content-Type: application/json"
    body: >
      {
        "model": "deepseek-ai/DeepSeek-V4-Flash",
        "messages": [
          {
            "role": "user",
            "content": "Reply only OK"
          }
        ],
        "max_tokens": 5,
        "stream": false
      }
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"choices"'
    maxResponseTime: 20000

  - name: Third Party Minimax
    slug: Minimax-Third
    url: https://api.xmyun.org/v1/chat/completions
    method: POST
    headers:
      - "Authorization: Bearer $AI_API_KEY"
      - "Content-Type: application/json"
    body: >
      {
        "model": "MiniMax-M2.7",
        "messages": [
          {
            "role": "user",
            "content": "Reply only OK"
          }
        ],
        "max_tokens": 5,
        "stream": false
      }
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"choices"'
    maxResponseTime: 20000

status-website:
  baseUrl: /apistatus

  name: Star Dream AI Status
  introTitle: "**Star Dream AI** 服务状态"
  introMessage: 在此可查看 API 可用性，北京时间22时至次日2时为高峰时段，API回复可能较慢或无法回复，请尽量在其他时间使用我们的服务！

  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
